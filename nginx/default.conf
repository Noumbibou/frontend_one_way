server {
    listen 80;
    server_name _;

    # Serve React build
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Optional: increase upload size if needed (e.g., for video uploads)
    client_max_body_size 600M;
}